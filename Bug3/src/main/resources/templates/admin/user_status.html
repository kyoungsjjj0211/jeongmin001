<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row mb-3 justify-content-end">
            <div class="col-md-4">
                <div class="input-group shadow-sm">
                    <input type="text" id="keywordInput" class="form-control"
                        th:value="${keyword}" placeholder="이메일 또는 닉네임 검색">
                    <button class="btn btn-primary" type="button"
                        onclick="loadTable(1)">검색</button>
                </div>
            </div>
        </div>

        <div id="userTableArea" class="table-responsive">
            <table class="table table-hover align-middle border">
                <thead class="table-light">
                    <tr>
                        <th>회원ID</th>
                        <th>이메일</th>
                        <th>상태</th>
                        <th>정지 사유 / 기한</th>
                        <th>관리 액션</th>
                        <th>가입 방식</th> 
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center py-4">조회된 회원이 없습니다.</td>
                    </tr>
                    
                    <tr th:each="user : ${users}">
                        <td th:text="${user.appUserId}" class="fw-bold"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:class="${user.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-danger'}"
                                  th:text="${user.status == 'ACTIVE' ? '정상' : '정지'}"></span>
                        </td>
                        <td>
                            <div th:if="${user.status == 'SUSPEND'}">
                                <small class="d-block text-danger"
                                    th:text="'사유: ' + ${user.suspendReason}"></small> 
                                <small class="d-block text-muted"
                                    th:text="'~ ' + ${user.suspendUntil}"></small>
                            </div> 
                            <span th:if="${user.status != 'SUSPEND'}">-</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/user_status/activate}" method="post"
                                th:if="${user.status == 'SUSPEND'}" class="d-inline">
                                <input type="hidden" name="appUserId" th:value="${user.appUserId}" />
                                <button type="submit" class="btn btn-sm btn-outline-success">정지 해제</button>
                            </form>

                            <form th:action="@{/admin/user_status/suspend}" method="post"
                                th:if="${user.status != 'SUSPEND'}" class="row g-1">
                                <input type="hidden" name="appUserId" th:value="${user.appUserId}" />
                                <div class="col-auto">
                                    <input type="text" name="reason" class="form-control form-control-sm" placeholder="사유" required />
                                </div>
                                <div class="col-auto">
                                    <input type="date" name="untilDate" class="form-control form-control-sm" required />
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-sm btn-danger">정지</button>
                                </div>
                            </form>
                        </td>
                        <td>
                            <span th:text="${user?.provider}"
                                  th:classappend="${user?.provider == 'local' ? 'badge bg-light text-dark' : 'badge bg-info'}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <nav th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)"
                           th:onclick="'loadTable(' + (${currentPage} - 1) + ')'">이전</a>
                    </li>
                    <li class="page-item"
                        th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${pageNum == currentPage} ? 'active'">
                        <a class="page-link" href="javascript:void(0)"
                           th:onclick="'loadTable(' + ${pageNum} + ')'" th:text="${pageNum}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)"
                           th:onclick="'loadTable(' + (${currentPage} + 1) + ')'">다음</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <script th:inline="javascript">
    window.loadTable = function(page) {
        const kwInput = document.getElementById('keywordInput');
        const keyword = kwInput ? kwInput.value : '';
        const url = "/admin/user_status/table?page=" + page + "&keyword=" + encodeURIComponent(keyword);
        
        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error('서버 에러');
                return response.text();
            })
            .then(html => {
                const target = document.getElementById('userTableArea');
                if (target) {
                    target.innerHTML = html;
                }
            })
            .catch(error => {
                console.error('로드 실패:', error);
            });
    };
    </script>
</body>
</html>
